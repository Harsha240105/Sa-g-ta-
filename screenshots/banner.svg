<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.3"/>
      <stop offset="50%" style="stop-color:#e94560;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)" rx="12"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="50" r="120" fill="#e94560" opacity="0.05"/>
  <circle cx="100" cy="250" r="80" fill="#ff6b6b" opacity="0.05"/>

  <!-- Sound wave visualization -->
  <path d="M50,150 Q100,80 150,130 Q200,180 250,120 Q300,60 350,140 Q400,220 450,110 Q500,0 550,130 Q600,260 650,110 Q700,-40 750,130 Q800,300 850,120 Q900,-60 950,140 Q1000,340 1050,130 Q1100,-80 1150,150" stroke="url(#wave)" stroke-width="4" fill="none" opacity="0.4"/>

  <!-- Title -->
  <text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">
    AI Saṅgīta Separator
  </text>

  <!-- Subtitle -->
  <text x="600" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#a0a0b8">
    Vocal &amp; Instrument Separation · Powered by Spleeter
  </text>

  <!-- Divider -->
  <rect x="400" y="175" width="400" height="3" rx="2" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="600" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8888aa">
    Upload  ▶  Separate  ▶  Preview  ▶  Download  ▶  Voice-Over
  </text>

  <!-- Python badge -->
  <rect x="320" y="235" width="100" height="28" rx="14" fill="#3776AB"/>
  <text x="370" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Python</text>

  <!-- Streamlit badge -->
  <rect x="440" y="235" width="100" height="28" rx="14" fill="#FF4B4B"/>
  <text x="490" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Streamlit</text>

  <!-- Spleeter badge -->
  <rect x="560" y="235" width="100" height="28" rx="14" fill="#2ecc71"/>
  <text x="610" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Spleeter</text>

  <!-- TensorFlow badge -->
  <rect x="680" y="235" width="110" height="28" rx="14" fill="#FF6F00"/>
  <text x="735" y="254" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">TensorFlow</text>

  <!-- Owner -->
  <text x="600" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#666688">
    👑 Harsha240105
  </text>
</svg>
